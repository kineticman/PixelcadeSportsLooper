services:
  pixelweb:
    build: .
    command:
      - sh
      - -c
      - |
        device_present() {
          for dev in /dev/ttyACM* /dev/ttyUSB*; do
            [ -e "$$dev" ] && return 0
          done
          return 1
        }

        while true; do
          until device_present; do
            echo "Waiting for Pixelcade serial device..."
            sleep 10
          done

          /pixelcade/pixelweb -port 8080 -p /pixelcade -d auto -devicescan -delay 10 -nointro &
          pid=$$!
          missing=0

          while kill -0 "$$pid" 2>/dev/null; do
            if device_present; then
              missing=0
            else
              missing=$$((missing + 1))
              if [ "$$missing" -ge 3 ]; then
                echo "Pixelcade serial device disappeared; restarting pixelweb..."
                kill "$$pid" 2>/dev/null || true
                sleep 3
                if kill -0 "$$pid" 2>/dev/null; then
                  kill -9 "$$pid" 2>/dev/null || true
                fi
                wait "$$pid" 2>/dev/null || true
                break
              fi
            fi
            sleep 5
          done

          wait "$$pid" 2>/dev/null || true
          sleep 2
        done
    network_mode: host
    privileged: true
    restart: unless-stopped
    environment:
      TZ: America/New_York
    volumes:
      - /dev:/dev
      - ./pixelcade-runtime:/pixelcade
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

  sportslooper:
    build: .
    network_mode: host
    restart: unless-stopped
    environment:
      TZ: America/New_York
    volumes:
      - ./app/config.json:/app/config.json
      - /dev:/host-dev:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
