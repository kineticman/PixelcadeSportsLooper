# Rotates the Pixelcade listener debug log. pixelweb writes it inside the
# container at /pixelcade/pixelweb-debug.log, which is the pixelcade-runtime/
# directory on the host. Replace the placeholder path below with that absolute
# host path before installing this file.
#
# Install with:
#   sudo install -m 644 deploy/logrotate-pixelcade.conf /etc/logrotate.d/pixelcade

/path/to/PixelcadeSportsLooper/pixelcade-runtime/pixelweb-debug.log {
    size 100M
    rotate 3
    compress
    delaycompress
    copytruncate
    missingok
    notifempty
    su root root
}
