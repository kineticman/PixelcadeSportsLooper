# Rotates the Pixelcade listener debug log. pixelweb writes it inside the
# container at /pixelcade/pixelweb-debug.log, which is the pixelcade-runtime/
# directory on the host, and it grows by roughly 20-50 MB/day when debug and
# trace logging are left on.
#
# Install with:
#   sudo install -m 644 deploy/logrotate-pixelcade.conf /etc/logrotate.d/pixelcade
#
# The log directory belongs to brad, so logrotate rotates it as that user. The
# container creates the log as root, so hand it to brad first:
#   docker exec pixelcade-pixelweb-1 chown 1000:1000 /pixelcade/pixelweb-debug.log
# (re-run that if the file is ever recreated; root can still append to it)

/home/brad/Projects/pixelcade/pixelcade-runtime/pixelweb-debug.log {
    size 100M
    rotate 3
    compress
    delaycompress
    copytruncate
    missingok
    notifempty
    su brad brad
}
